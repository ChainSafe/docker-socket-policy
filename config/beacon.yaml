# Per-service policy for the Lodestar beacon node.
# Test with: docker-socket-policy --config-dir=./config
service_name: beacon
# Optional (#85, #86). Creates use this policy only for these names, and
# lifecycle actions (start, stop, rm, ...) reach only containers it covers:
# these names, or service_name when container_names is unset. A second policy
# for chainsafe/lodestar (a validator client, say) must set its own,
# disjoint container_names, or the proxy refuses to start.
container_names:
  - beacon
user_id: '2001'
group_id: '2001'

allowed_image_prefixes:
  - chainsafe/lodestar
  - ethpandaops/lodestar

image_tag_pattern: '[A-Za-z0-9._\-]{1,128}'
image_digest_allowed: true

container_config:
  network_mode: host
  restart_policy: unless-stopped
  security_options:
    - no-new-privileges:true
  user: '2001:2001'
  # Optional (#93). Forced as HostConfig.GroupAdd: supplementary groups for
  # reading host files, here the JWT secret (root:jwt 0640). Quote GIDs; 0
  # and root are refused. A caller's own list is replaced.
  group_add:
    - '64190'
  log_driver: json-file
  log_options:
    max-file: '5'
    max-size: 100m
    mode: non-blocking
    max-buffer-size: 4m

volumes:
  - host_path: /home/beacon
    container_path: /data
    read_write: true
  - host_path: /etc/jwt_dir
    container_path: /jwtdir
    read_write: false

env_file: /home/beacon/beacon.env

allowed_cli_flags:
  - --rcConfig
  - --logLevel
  - --dataDir
  - --network

flag_rules:
  - flag: --rcConfig
    value_pattern: '^/data/.*\.yml$'
  - flag: --logLevel
    value_pattern: '^(debug|info|warn|error)$'
  - flag: --network
    value_pattern: '^(mainnet|hoodi|sepolia|gnosis|chiado)$'

denied_flags:
  - --volume
  - --mount
  - --privileged
  - --cap-add
  - --cap-drop
  - --device
  - --security-opt
  - --user
  - --network
  - --pid
  - --ipc
