name: docker-socket-policy-test-tcp-${IMPL:-go}

services:
  dind:
    image: docker:28-dind
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    command:
      - dockerd
      - --host=tcp://0.0.0.0:2375
      - --tls=false
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:2375/_ping"]
      interval: 3s
      retries: 20
      timeout: 10s
      start_period: 5s

  proxy:
    build:
      context: ../${IMPL:-go}
      dockerfile: Dockerfile
    user: "0:0"
    depends_on:
      dind:
        condition: service_healthy
    ports:
      - "12375:2375"
    volumes:
      - ./config:/etc/docker-socket-policy/services:ro
    command:
      - --docker-host=tcp://dind:2375
      - --listen-tcp=0.0.0.0:2375
      - --listen-socket=/tmp/docker-socket-policy.sock
      - --config-dir=/etc/docker-socket-policy/services
      - --log-file=/tmp/docker-socket-policy.log

  test:
    image: docker:28-cli
    depends_on:
      - proxy
    environment:
      DOCKER_HOST: tcp://proxy:2375
    volumes:
      - ./test.sh:/test.sh:ro
    entrypoint: ["/bin/sh", "/test.sh"]
