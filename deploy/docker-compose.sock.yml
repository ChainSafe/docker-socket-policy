name: docker-socket-policy-test-sock-${IMPL:-go}

volumes:
  sock-data:

services:
  sock-perms:
    image: alpine:3.20
    command:
      - sh
      - -c
      - |
        apk add --no-cache socat
        addgroup -g 2001 dockertest
        socat UNIX-LISTEN:/sock/docker.sock,unlink-early,fork,group=dockertest,perm=660 \
              UNIX-CONNECT:/var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - sock-data:/sock

  proxy-granted:
    build:
      context: ../${IMPL:-go}
      dockerfile: Dockerfile
    # User 65532 with GID 2001 — has group access to the restricted socket
    user: 65532:2001
    depends_on:
      sock-perms:
        condition: service_started
    ports:
      - "12376:2375"
    volumes:
      - ./config:/etc/docker-socket-policy/services:ro
      - sock-data:/sock
    command:
      - --docker-host=/sock/docker.sock
      - --listen-tcp=0.0.0.0:2375
      - --listen-socket=/tmp/docker-socket-policy.sock
      - --config-dir=/etc/docker-socket-policy/services
      - --log-file=/tmp/docker-socket-policy.log

  proxy-denied:
    build:
      context: ../${IMPL:-go}
      dockerfile: Dockerfile
    # User 65532 with GID 3001 — NOT in dockertest group, should fail
    user: 65532:3001
    depends_on:
      sock-perms:
        condition: service_started
    ports:
      - "12377:2375"
    volumes:
      - ./config:/etc/docker-socket-policy/services:ro
      - sock-data:/sock
    command:
      - --docker-host=/sock/docker.sock
      - --listen-tcp=0.0.0.0:2375
      - --listen-socket=/tmp/docker-socket-policy.sock
      - --config-dir=/etc/docker-socket-policy/services
      - --log-file=/tmp/docker-socket-policy.log

  test:
    image: docker:28-cli
    depends_on:
      - proxy-granted
      - proxy-denied
    environment:
      PROXY_GRANTED: http://proxy-granted:2375
      PROXY_DENIED: http://proxy-denied:2375
    volumes:
      - ./test-sock.sh:/test-sock.sh:ro
    entrypoint: ["/bin/sh", "/test-sock.sh"]
