name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.22'
          cache-dependency-path: go/go.sum
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.85"
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - working-directory: ts
        run: npm ci
      - name: Install Quint
        run: npm install -g @informalsystems/quint
      - name: Release verification gate
        run: make release-verify

  version:
    needs: [release-verify]
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Bump patch version
        id: bump
        run: |
          LATEST=$(git tag --list 'v*' --sort=-v:refname | head -1 || echo "v0.0.0")
          MAJOR=$(echo "$LATEST" | sed 's/^v//' | cut -d. -f1)
          MINOR=$(echo "$LATEST" | sed 's/^v//' | cut -d. -f2)
          PATCH=$(echo "$LATEST" | sed 's/^v//' | cut -d. -f3)
          echo "tag=v${MAJOR}.${MINOR}.$((PATCH + 1))" >> "$GITHUB_OUTPUT"
      - name: Create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.bump.outputs.tag }}"
          git push origin "${{ steps.bump.outputs.tag }}"
      - name: Create draft prerelease
        run: |
          gh release create "${{ steps.bump.outputs.tag }}" \
            --title "${{ steps.bump.outputs.tag }}" \
            --generate-notes \
            --draft \
            --prerelease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-go:
    needs: [version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.22'
          cache-dependency-path: go/go.sum
      - name: Build Go binary
        run: |
          cd go && go build \
            -trimpath \
            -ldflags="-s -w -buildid= -X main.Version=${{ needs.version.outputs.tag }}" \
            -o ../docker-socket-policy-go \
            .
      - name: Upload Go binary to release
        run: |
          gh release upload "${{ needs.version.outputs.tag }}" \
            docker-socket-policy-go \
            --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Docker image build, SBOM, and Cosign steps only run in the amd64 job.
      # buildx handles multi-arch in a single operation (platforms: linux/amd64,linux/arm64).
       - if: matrix.goarch == 'amd64'
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - if: matrix.goarch == 'amd64'
        name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: matrix.goarch == 'amd64'
        name: Build and push Go Docker image (multi-arch)
        uses: docker/build-push-action@v7
        with:
          context: go
          file: go/Dockerfile
          # Multi-arch: buildx creates a single image index for amd64 & arm64.
          # This eliminates race conditions from matrix jobs pushing to the same tag.
          # SBOM and Cosign operations then work on the completed index.
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ needs.version.outputs.tag }}
          tags: |
            ghcr.io/chainsafe/docker-socket-policy-go:${{ needs.version.outputs.tag }}
            ghcr.io/chainsafe/docker-socket-policy-go:latest
      - if: matrix.goarch == 'amd64'
        name: Install syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | \
            sh -s -- -b /usr/local/bin v1.42.3
      - if: matrix.goarch == 'amd64'
        name: Generate SPDX SBOM for Go image
        run: >
          syft ghcr.io/chainsafe/docker-socket-policy-go:${{ needs.version.outputs.tag }}
          -o spdx-json
          --file docker-socket-policy-go.spdx.json
      - if: matrix.goarch == 'amd64'
        name: Generate CycloneDX SBOM for Go image
        run: >
          syft ghcr.io/chainsafe/docker-socket-policy-go:${{ needs.version.outputs.tag }}
          -o cyclonedx-json
          --file docker-socket-policy-go.cyclonedx.json
      - if: matrix.goarch == 'amd64'
        name: Upload Go SBOMs to release
        run: |
          gh release upload "${{ needs.version.outputs.tag }}" \
            docker-socket-policy-go.spdx.json \
            docker-socket-policy-go.cyclonedx.json \
            --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: matrix.goarch == 'amd64'
        uses: sigstore/cosign-installer@v3
      - if: matrix.goarch == 'amd64'
        name: Sign Go Docker image with Cosign
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          cosign sign --yes \
            ghcr.io/chainsafe/docker-socket-policy-go:${{ needs.version.outputs.tag }}

  release-rust:
    needs: [version]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust_target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
        include:
          - rust_target: x86_64-unknown-linux-musl
            arch_name: amd64
          - rust_target: aarch64-unknown-linux-musl
            arch_name: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.85"
          # `target` (singular). The action rejected `targets` with
          # "Unexpected input(s) 'targets'" and silently installed nothing.
          target: ${{ matrix.rust_target }}
      # --locked is REQUIRED, not a nicety. Without it `cargo install`
      # re-resolves cross's dependencies to the newest semver-compatible
      # versions on crates.io, ignoring the lockfile cross was released with.
      # Those newer crates raised their MSRV above the toolchain pinned above,
      # which broke this job with no change on our side:
      #   home@0.5.12 requires rustc 1.88
      #   textwrap@0.16.3 requires rustc 1.90
      #   (toolchain here is 1.85)
      # --locked builds cross from its own Cargo.lock, so this step stops
      # depending on what the wider crates.io ecosystem published today.
      - name: Install cross
        run: cargo install cross --locked
      - name: Build Rust binary
        run: cd rs && cross build --release --target ${{ matrix.rust_target }}
      - name: Upload Rust binary to release
        run: |
          cp rs/target/${{ matrix.rust_target }}/release/docker-socket-policy docker-socket-policy-rs-linux-${{ matrix.arch_name }}
          gh release upload "${{ needs.version.outputs.tag }}" \
            docker-socket-policy-rs-linux-${{ matrix.arch_name }} \
            --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
       # Docker image build, SBOM, and Cosign steps only run in the amd64 job.
       - if: matrix.arch_name == 'amd64'
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - if: matrix.arch_name == 'amd64'
        name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: matrix.arch_name == 'amd64'
        name: Build and push Rust Docker image (multi-arch)
        uses: docker/build-push-action@v7
        with:
          context: rs
          file: rs/Dockerfile
          # Multi-arch: buildx creates a single image index for amd64 & arm64.
          # This eliminates race conditions from matrix jobs pushing to the same tag.
          # SBOM and Cosign operations then work on the completed index.
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ needs.version.outputs.tag }}
          tags: |
            ghcr.io/chainsafe/docker-socket-policy-rs:${{ needs.version.outputs.tag }}
            ghcr.io/chainsafe/docker-socket-policy-rs:latest
      - if: matrix.arch_name == 'amd64'
        name: Install syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | \
            sh -s -- -b /usr/local/bin v1.42.3
      - if: matrix.arch_name == 'amd64'
        name: Generate SPDX SBOM for Rust image
        run: >
          syft ghcr.io/chainsafe/docker-socket-policy-rs:${{ needs.version.outputs.tag }}
          -o spdx-json
          --file docker-socket-policy-rs.spdx.json
      - if: matrix.arch_name == 'amd64'
        name: Generate CycloneDX SBOM for Rust image
        run: >
          syft ghcr.io/chainsafe/docker-socket-policy-rs:${{ needs.version.outputs.tag }}
          -o cyclonedx-json
          --file docker-socket-policy-rs.cyclonedx.json
      - if: matrix.arch_name == 'amd64'
        name: Upload Rust SBOMs to release
        run: |
          gh release upload "${{ needs.version.outputs.tag }}" \
            docker-socket-policy-rs.spdx.json \
            docker-socket-policy-rs.cyclonedx.json \
            --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: matrix.arch_name == 'amd64'
        uses: sigstore/cosign-installer@v3
      - if: matrix.arch_name == 'amd64'
        name: Sign Rust Docker image with Cosign
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          cosign sign --yes \
            ghcr.io/chainsafe/docker-socket-policy-rs:${{ needs.version.outputs.tag }}

  release-ts:
    needs: [version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ts/package-lock.json
      - name: Build TypeScript
        run: |
          cd ts && npm ci
          npm run build
      - name: Create TypeScript archive
        run: |
          cd ts && tar czf ../docker-socket-policy-ts-${{ needs.version.outputs.tag }}.tar.gz \
            dist/ node_modules/ package.json package-lock.json
      - name: Upload TypeScript archive to release
        run: |
          gh release upload "${{ needs.version.outputs.tag }}" \
            docker-socket-policy-ts-${{ needs.version.outputs.tag }}.tar.gz \
            --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
       - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push TypeScript Docker image
        uses: docker/build-push-action@v7
        with:
          context: ts
          file: ts/Dockerfile
          push: true
          tags: |
            ghcr.io/chainsafe/docker-socket-policy-ts:${{ needs.version.outputs.tag }}
            ghcr.io/chainsafe/docker-socket-policy-ts:latest
      - name: Install syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | \
            sh -s -- -b /usr/local/bin v1.42.3
      - name: Generate SPDX SBOM for TS image
        run: >
          syft ghcr.io/chainsafe/docker-socket-policy-ts:${{ needs.version.outputs.tag }}
          -o spdx-json
          --file docker-socket-policy-ts.spdx.json
      - name: Generate CycloneDX SBOM for TS image
        run: >
          syft ghcr.io/chainsafe/docker-socket-policy-ts:${{ needs.version.outputs.tag }}
          -o cyclonedx-json
          --file docker-socket-policy-ts.cyclonedx.json
      - name: Upload TypeScript SBOMs to release
        run: |
          gh release upload "${{ needs.version.outputs.tag }}" \
            docker-socket-policy-ts.spdx.json \
            docker-socket-policy-ts.cyclonedx.json \
            --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v3
      - name: Sign TypeScript Docker image with Cosign
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          cosign sign --yes \
            ghcr.io/chainsafe/docker-socket-policy-ts:${{ needs.version.outputs.tag }}

  publish-release:
    runs-on: ubuntu-latest
    needs: [version, release-go, release-rust, release-ts]
    steps:
      - name: Publish release
        run: |
          gh release edit "${{ needs.version.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --draft=false \
            --prerelease=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
